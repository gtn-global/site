# Netlify 部署配置（仓库根，Netlify 自动读取）
# ⚠️ 勿手改；改前先看《海鑫汇GTN-网站运维 Handoff.md》五-B 节。
# 当前为纯静态发布：直接发布仓库根目录（publish = "."）。
# 历史：catch-all rewrite（from="/*" to="/index.html"）已在 da08276 提交删除，避免软 404。

[build]
  publish = "."
  # 部署前自动执行：生成 sitemap.xml+llms.txt，并自动校验/自动修（如 gtn.me 残留）。
  # 校验发现需人工处理的问题时脚本非零退出 → Netlify 自动拦截本次部署，不会发错版本。
  # 此机制不依赖任何人工/智能体操作；详见《海鑫汇GTN-网站运维 Handoff.md》五-B 节。
  command = "node generate-sitemap.js"
