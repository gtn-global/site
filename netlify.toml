# Netlify 部署配置（仓库根，Netlify 自动读取）
# ⚠️ 勿手改；改前先看《海鑫汇GTN-网站运维 Handoff.md》五-B 节。
# 当前为纯静态发布：直接发布仓库根目录（publish = "."）。
# 历史：catch-all rewrite（from="/*" to="/index.html"）已在 da08276 提交删除，避免软 404。

[build]
  publish = "."
  # 部署前自动执行：生成 sitemap.xml+llms.txt，并自动校验/自动修（如 gtn.me 残留）。
  # 校验发现需人工处理的问题时脚本非零退出 → Netlify 自动拦截本次部署，不会发错版本。
  # 此机制不依赖任何人工/智能体操作；详见《海鑫汇GTN-网站运维 Handoff.md》五-B 节。
  command = "node generate-sitemap.js"

# 全站跳转到新主域名 gatewaytonew.com（旧 netlify 域名访客统一跳转）
# 放在 netlify.toml 而非 _redirects：Cloudflare Pages 只读 _redirects，若放 _redirects 会自循环。
[[redirects]]
  from = "/*"
  to = "https://gatewaytonew.com/:splat"
  status = 301
  force = true

# 百度站点验证文件：强制以 .html 原路径 200 返回，禁止 Pretty URLs 的 308 跳转（否则百度校验器报"无法连接"）
[[redirects]]
  from = "/baidu_verify_codeva-vBQIDsI7r2.html"
  to = "/baidu_verify_codeva-vBQIDsI7r2.html"
  status = 200
  force = true
