<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>海鑫汇·出海沙龙 场次模板 | 海鑫汇 Gateway To New</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #e5e1db;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    }

    /* 海报 1080×1440 */
    .poster {
      width: 1080px;
      height: 1440px;
      background: #F8F5F0;
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(10, 31, 68, 0.12);
      display: flex;
      flex-direction: column;
      padding: 52px 60px 44px;
    }

    /* 系列名（固定） */
    .series {
      font-size: 18px;
      font-weight: 500;
      color: #0A1F44;
      letter-spacing: 1px;
      margin-bottom: 28px;
    }

    /* ===== 主题区 ===== */
    .theme-section {
      margin-bottom: 36px;
    }

    .theme-label {
      font-size: 16px;
      color: #6B7280;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .theme-title {
      font-size: 42px;
      font-weight: 700;
      color: #0A1F44;
      line-height: 1.25;
      letter-spacing: 1px;
      margin-bottom: 14px;
      font-family: "Songti SC", "SimSun", "Noto Serif SC", serif;
    }

    .theme-meta {
      font-size: 22px;
      color: #4A5568;
      letter-spacing: 0.4px;
    }

    /* ===== 嘉宾区 ===== */
    .guest-section {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-bottom: 40px;
      padding: 24px 0;
      border-top: 1px solid rgba(10, 31, 68, 0.1);
      border-bottom: 1px solid rgba(10, 31, 68, 0.1);
    }

    /* 1:1 头像位（空白，由用户放真实照片） */
    .avatar-slot {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 1.5px solid rgba(10, 31, 68, 0.18);
      background: #FFFFFF;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #A0AEC0;
      font-size: 14px;
      text-align: center;
      line-height: 1.3;
    }

    .guest-info {
      flex: 1;
    }

    .guest-label {
      font-size: 15px;
      color: #6B7280;
      margin-bottom: 8px;
      letter-spacing: 0.4px;
    }

    .guest-name {
      font-size: 28px;
      font-weight: 600;
      color: #0A1F44;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .guest-title {
      font-size: 20px;
      color: #4A5568;
      line-height: 1.4;
    }

    /* ===== 流程区（竖向时间轴） ===== */
    .flow-section {
      margin-bottom: 36px;
    }

    .flow-label {
      font-size: 16px;
      color: #6B7280;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
    }

    .timeline {
      position: relative;
      padding-left: 28px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 5px;
      top: 8px;
      bottom: 8px;
      width: 1.5px;
      background: rgba(10, 31, 68, 0.15);
    }

    .node {
      position: relative;
      margin-bottom: 28px;
    }

    .node:last-child {
      margin-bottom: 0;
    }

    .node .dot {
      position: absolute;
      left: -28px;
      top: 6px;
      width: 12px;
      height: 12px;
      background: #C9A227;
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(201, 162, 39, 0.15);
    }

    .node-time {
      font-size: 18px;
      color: #C9A227;
      font-weight: 500;
      margin-bottom: 4px;
      letter-spacing: 0.3px;
    }

    .node-content {
      font-size: 22px;
      color: #0A1F44;
      line-height: 1.45;
    }

    /* ===== 名额与价格 ===== */
    .info-row {
      display: flex;
      gap: 40px;
      margin-bottom: 36px;
      font-size: 22px;
      color: #0A1F44;
    }

    .info-row span {
      letter-spacing: 0.3px;
    }

    /* 行动区（固定） */
    .cta {
      font-size: 26px;
      font-weight: 500;
      color: #0A1F44;
      letter-spacing: 0.5px;
      margin-top: auto;
      margin-bottom: 52px;
    }



    /* 底部品牌小字（固定） */
    .footer {
      position: absolute;
      left: 60px;
      right: 60px;
      bottom: 30px;
      font-size: 14px;
      color: #6B7280;
      letter-spacing: 0.3px;
    }
  </style>
