<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3分钟出海自测 | 海鑫汇 Gateway To New</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #e5e1db;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    }

    /* 海报 1080×1440 */
    .poster {
      width: 1080px;
      height: 1440px;
      background: #F8F5F0;
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(10, 31, 68, 0.12);
      display: flex;
      flex-direction: column;
      padding: 60px 68px 48px;
    }

    /* 品牌 */
    .brand {
      font-size: 20px;
      font-weight: 500;
      color: #0A1F44;
      letter-spacing: 0.6px;
      margin-bottom: 48px;
    }

    /* 主标题 */
    .title {
      font-size: 52px;
      font-weight: 700;
      color: #0A1F44;
      letter-spacing: 1.5px;
      line-height: 1.2;
      margin-bottom: 14px;
      font-family: "Songti SC", "SimSun", "Noto Serif SC", serif;
    }

    /* 副标题 */
    .sub {
      font-size: 26px;
      color: #4A5568;
      font-weight: 400;
      letter-spacing: 0.4px;
      margin-bottom: 52px;
    }

    /* 仪表盘主视觉 */
    .gauge-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 48px;
    }

    .gauge {
      width: 340px;
      height: 190px;
      position: relative;
      overflow: hidden;
    }

    .gauge-bg {
      width: 340px;
      height: 340px;
      border-radius: 50%;
      border: 18px solid #E8E4DE;
      border-bottom-color: transparent;
      border-left-color: transparent;
      position: absolute;
      top: 0;
      left: 0;
      transform: rotate(-45deg);
    }

    .gauge-progress {
      width: 340px;
      height: 340px;
      border-radius: 50%;
      border: 18px solid transparent;
      border-top-color: #0A1F44;
      border-right-color: #0A1F44;
      position: absolute;
      top: 0;
      left: 0;
      transform: rotate(-45deg);
    }

    .gauge-needle {
      position: absolute;
      bottom: 8px;
      left: 50%;
      width: 6px;
      height: 130px;
      background: #C9A227;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(28deg);
      border-radius: 3px;
      z-index: 2;
    }

    .gauge-needle::after {
      content: "";
      position: absolute;
      bottom: -8px;
      left: 50%;
      width: 18px;
      height: 18px;
      background: #C9A227;
      border-radius: 50%;
      transform: translateX(-50%);
    }

    .gauge-center {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 28px;
      background: #0A1F44;
      border-radius: 50%;
      z-index: 3;
    }

    /* 要点区 */
    .points {
      list-style: none;
      margin-bottom: 40px;
    }

    .points li {
      display: flex;
      align-items: flex-start;
      margin-bottom: 18px;
      font-size: 24px;
      color: #0A1F44;
      line-height: 1.45;
    }

    .points li .dot {
      width: 10px;
      height: 10px;
      background: #C9A227;
      border-radius: 50%;
      margin: 10px 14px 0 0;
      flex-shrink: 0;
    }

    /* 四个小标签 */
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 14px;
      margin-bottom: 48px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 10px 16px;
      background: #FFFFFF;
      border: 1px solid rgba(10, 31, 68, 0.14);
      font-size: 20px;
      color: #0A1F44;
      letter-spacing: 0.2px;
      line-height: 1.3;
    }

    .tag::before {
      content: "";
      width: 5px;
      height: 5px;
      background: #C9A227;
      border-radius: 50%;
      margin-right: 10px;
      flex-shrink: 0;
    }

    /* 分隔线 */
    .divider {
      height: 1px;
      background: rgba(10, 31, 68, 0.12);
      margin-bottom: 32px;
    }

    /* 行动区 */
    .cta {
      font-size: 26px;
      font-weight: 500;
      color: #0A1F44;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    /* 小字说明 */
    .note {
      font-size: 18px;
      color: #6B7280;
    }



    /* 底部小字 */
    .footer {
      position: absolute;
      left: 68px;
      right: 68px;
      bottom: 34px;
      font-size: 15px;
      color: #6B7280;
      letter-spacing: 0.3px;
    }
  </style>
